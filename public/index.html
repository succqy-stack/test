<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070a14;--surface:rgba(255,255,255,.045);--surface2:rgba(255,255,255,.08);
    --line:rgba(255,255,255,.1);--ink:#eef1fb;--muted:#8d97b5;
    --red:#ff5a4f;--red2:#ff3d6e;--grad:linear-gradient(135deg,#ff5a4f,#ff3d8b);
    --ok:#3ddc97;--bad:#ff6b6b;--ease:cubic-bezier(.22,.8,.24,1);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;overflow:hidden}
  body{font-family:'Poppins',system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(900px 520px at 12% -8%,rgba(255,61,139,.16),transparent 60%),
               radial-gradient(800px 520px at 100% 0%,rgba(91,124,250,.16),transparent 60%),
               radial-gradient(900px 600px at 50% 120%,rgba(24,185,160,.10),transparent 60%),
               radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/24px 24px}
  ::selection{background:#ff5a4f66}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#ffffff22;border-radius:10px;border:2px solid transparent;background-clip:padding-box}

  .screen{display:none;height:100vh;height:100dvh;padding:16px 26px;overflow-x:hidden;overflow-y:auto;scrollbar-width:none}
  .screen::-webkit-scrollbar{display:none}
  #game{overflow:hidden}
  .screen.active{display:flex;flex-direction:column;animation:screenIn .55s var(--ease) both}
  @keyframes screenIn{from{opacity:0;transform:translateY(14px) scale(.992);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
  .logo{font-family:'Anton',Impact,'Arial Narrow',sans-serif;font-size:40px;line-height:1;text-transform:uppercase;letter-spacing:.5px;user-select:none;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(255,61,139,.35))}
  button{font-family:inherit}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .who{display:flex;gap:8px;flex-wrap:wrap}
  .who input,.who select{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;outline:none;transition:border-color .25s,background .25s,box-shadow .25s}
  .who input:focus,.who select:focus{border-color:#ff5a4f99;background:var(--surface2);box-shadow:0 0 0 4px #ff5a4f22}
  .who select option{color:#000}

  /* menu cards */
  .cards{margin:auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:1100px;width:100%;align-self:center;padding:20px 0}
  .mcard{position:relative;border:0;border-radius:22px;min-height:min(320px,48vh);color:#fff;text-align:left;padding:26px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
    box-shadow:0 18px 40px -12px #000a,inset 0 0 0 1px #ffffff22;transition:transform .45s var(--ease),box-shadow .45s var(--ease);
    animation:rise .7s var(--ease) both}
  .mcard:nth-child(2){animation-delay:.08s}.mcard:nth-child(3){animation-delay:.16s}
  @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  .mcard::after{content:"";position:absolute;inset:0;background:radial-gradient(420px 220px at var(--mx,70%) var(--my,0%),rgba(255,255,255,.28),transparent 60%);opacity:0;transition:opacity .4s}
  .mcard:hover{transform:translateY(-8px) scale(1.012);box-shadow:0 28px 56px -14px #000c,inset 0 0 0 1px #ffffff44}
  .mcard:hover::after{opacity:1}
  .mcard:active{transform:translateY(-3px) scale(.99)}
  .mcard .ic{position:absolute;top:16px;right:20px;font-size:92px;opacity:.3;transition:transform .6s var(--ease),opacity .4s}
  .mcard:hover .ic{transform:scale(1.14) rotate(-8deg);opacity:.5}
  .mcard b{font-size:28px;font-weight:600;position:relative;z-index:1}
  .mcard span{font-size:15px;opacity:.9;position:relative;z-index:1}
  .c1{background:linear-gradient(160deg,#ff7a59,#c8283a 85%)}
  .c2{background:linear-gradient(160deg,#5b7cfa,#5a24c4 85%)}
  .c3{background:linear-gradient(160deg,#18b9a0,#0a5f78 85%)}

  /* generic cards / buttons */
  .box{background:var(--surface);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:20px;padding:22px;border:1px solid var(--line);box-shadow:0 20px 50px -20px #000c}
  .rbtn{border:0;border-radius:12px;padding:13px 20px;background:var(--grad);color:#fff;font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 8px 22px -8px rgba(255,61,110,.7);transition:transform .25s var(--ease),box-shadow .25s,filter .25s,opacity .25s}
  .rbtn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 14px 28px -8px rgba(255,61,110,.8)}
  .rbtn:active:not(:disabled){transform:translateY(0) scale(.98)}
  .rbtn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .obtn{border:1px solid var(--line);border-radius:12px;padding:12px 18px;background:var(--surface);font-weight:600;font-size:15px;cursor:pointer;color:var(--ink);transition:background .25s,border-color .25s,transform .25s var(--ease)}
  .obtn:hover{background:var(--surface2);border-color:#ffffff40;transform:translateY(-2px)}
  .obtn:active{transform:scale(.98)}
  .link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px;margin-top:6px;transition:color .2s}
  .link:hover:not(:disabled){color:var(--ink)}
  .field{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);font:inherit;font-size:16px;outline:none;background:rgba(0,0,0,.28);color:var(--ink);transition:border-color .25s,box-shadow .25s,background .25s}
  .field::placeholder{color:#6d7798}
  .field:focus{border-color:#ff5a4fbb;box-shadow:0 0 0 4px #ff5a4f22;background:rgba(0,0,0,.4)}
  select.field option{color:#000}
  .center{max-width:460px;width:100%;margin:auto;text-align:center}
  .center h2{margin:0 0 6px}
  .stack{display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .divider{opacity:.6;margin:6px 0;font-size:13px}

  /* game: everything centred, image in the middle */
  .g-main{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:8px;min-height:0;width:100%;max-width:760px;margin-left:auto;margin-right:auto}
  .side{display:contents}
  .banner{order:0;display:flex;gap:10px;font-weight:600}
  .banner>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px 20px;text-align:center;backdrop-filter:blur(12px);min-width:110px}
  .banner span{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
  .banner b{font-size:22px;line-height:1.15;font-weight:700;display:inline-block}
  .banner b.bump{animation:bump .5s var(--ease)}
  @keyframes bump{40%{transform:scale(1.25);color:var(--ok)}}
  #oppSc{font-size:12px;color:var(--muted);display:block}
  .stage{order:1;flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:12px;justify-content:center;align-items:center;min-width:0;width:100%}
  .frame{position:relative;border-radius:20px;overflow:hidden;background:#0d1120;line-height:0;max-width:100%;
    box-shadow:0 30px 70px -20px #000,0 0 0 1px var(--line),0 0 80px -30px rgba(255,61,139,.45)}
  .frame img{display:block;max-width:none;opacity:0;transform:scale(1.03);transition:opacity .5s var(--ease),transform .7s var(--ease),width .35s var(--ease),height .35s var(--ease)}
  .frame img.in{opacity:1;transform:none}
  .thumbs{display:flex;flex-direction:row;gap:10px;justify-content:center;flex-wrap:wrap}
  .thumb{width:44px;height:58px;border:2px solid transparent;border-radius:12px;overflow:hidden;padding:0;background:#222;cursor:pointer;opacity:.55;transform:scale(.94);transition:opacity .3s,transform .35s var(--ease),border-color .3s,box-shadow .3s}
  .thumb:hover{opacity:.95;transform:scale(1)}
  .thumb.sel{border-color:#ff5a8b;opacity:1;transform:scale(1.06);box-shadow:0 8px 20px -6px rgba(255,61,139,.7)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .panel{order:2;width:100%;max-width:580px;background:var(--surface);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 24px 60px -24px #000}
  .panel>div:not([hidden]){animation:viewIn .45s var(--ease) both}
  @keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .phead{padding:11px 16px 10px;display:flex;justify-content:space-between;align-items:center;font-weight:600;gap:10px}
  #timeTxt{font-variant-numeric:tabular-nums;background:var(--surface2);border-radius:999px;padding:2px 12px;min-width:44px;text-align:center}
  .tbar{height:5px;background:#ffffff14;margin:0 16px;border-radius:99px;overflow:hidden}
  .tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f2b705,#ff9d2e);border-radius:99px;transition:width .12s linear,background .4s}
  .tbar i.urgent{background:linear-gradient(90deg,#ff5a4f,#ff3d6e);animation:pulse .8s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.6}}
  .pbody{padding:12px 16px 14px}
  .combo{position:relative}
  .combo #answer{padding-right:46px}
  .chev{position:absolute;right:6px;top:6px;bottom:6px;width:36px;border:0;border-radius:8px;background:none;font-size:16px;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
  .chev:hover{background:var(--surface2);color:var(--ink)}
  #answer{font-size:17px}
  .gbtn{width:100%;margin-top:10px;padding:12px;border:0;border-radius:12px;background:#ffffff1a;color:#fff;font-weight:600;font-size:15px;cursor:pointer;transition:background .3s,transform .25s var(--ease),box-shadow .3s,opacity .25s}
  .gbtn:hover:not(:disabled){background:var(--grad);transform:translateY(-2px);box-shadow:0 12px 26px -10px rgba(255,61,110,.8)}
  .gbtn:active:not(:disabled){transform:scale(.98)}
  .gbtn:disabled{opacity:.5;cursor:default}
  #capNote{min-height:18px;margin-top:8px;font-size:14px;font-weight:600;color:#ff8a80;transition:opacity .3s}
  #capNote:not(:empty){animation:viewIn .35s var(--ease)}
  .dd{position:fixed;z-index:50;background:rgba(14,20,40,.96);backdrop-filter:blur(16px);color:#fff;border-radius:14px;box-shadow:0 20px 50px #000c;overflow-y:auto;padding:6px;border:1px solid var(--line);animation:ddIn .2s var(--ease)}
  @keyframes ddIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
  .dd .dh{font-size:11px;font-weight:700;letter-spacing:1px;color:#9fb0d0;background:#ffffff12;border-radius:6px;padding:3px 10px;margin:4px 0}
  .dd .di{padding:9px 12px;border-radius:8px;cursor:pointer;font-size:15px;border:1px solid transparent;transition:background .15s,border-color .15s}
  .dd .di:hover,.dd .di.hi{border-color:#ff5a4f88;background:#ffffff12}
  .dd .dn{padding:10px 12px;color:#9fb0d0;font-size:14px}
  .rrow{display:grid;grid-template-columns:80px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);transition:background .4s}
  .rname{font-weight:600;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
  .rsaid{font-size:16px;word-break:break-word;transition:color .4s}
  .rverd{font-weight:700;font-size:14px;color:var(--muted)}
  .rrow.ok .rverd,.rrow.bad .rverd{animation:pop .45s var(--ease)}
  .rrow.ok .rverd,.rrow.ok .rsaid{color:var(--ok)}
  .rrow.bad .rverd,.rrow.bad .rsaid{color:var(--bad)}
  .rrow.bad .rsaid{text-decoration:line-through;text-decoration-color:#ff6b6b66}
  .abox{margin-top:10px;text-align:center;padding:10px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line);transition:border-color .5s,box-shadow .5s}
  .abox small{color:var(--muted);display:block}
  .abox.show{border-color:#ff5a4f66;box-shadow:0 0 40px -12px rgba(255,61,139,.6)}
  .atitle{font-weight:700;font-size:20px;margin-top:2px;color:#4c5473}
  .abox.show .atitle{color:var(--ink);animation:pop .5s var(--ease)}
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  #nextInfo{text-align:center;font-size:13px;color:var(--muted);margin-top:8px}

  /* lobby */
  .lgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:1000px;width:100%;margin:auto}
  .lgrid .box:nth-child(2){animation-delay:.1s}
  .lgrid .box{animation:rise .6s var(--ease) both}
  .code{font-family:'Anton',Impact,sans-serif;font-size:58px;letter-spacing:9px;text-align:center;margin:6px 0;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .player{display:flex;align-items:center;gap:10px;padding:11px 14px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;margin:6px 0;font-weight:500;transition:color .3s,opacity .3s}
  .player i{width:10px;height:10px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 10px var(--ok);transition:background .3s,box-shadow .3s}
  .player.wait{color:#7a84a3}.player.wait i{background:#555e7a;box-shadow:none}
  .chatlog{height:min(300px,32vh);scrollbar-width:none;overflow:auto;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:14px;margin-bottom:10px;scroll-behavior:smooth}
  .msg{word-break:break-word;animation:viewIn .3s var(--ease)}.msg b{color:var(--red)}.msg.me b{color:#6ea8ff}
  .msg.sys{color:var(--muted);font-style:italic}
  .rhead{text-align:center;margin-bottom:10px}
  .rbig{font-size:26px;font-weight:700}
  .rsub{color:var(--muted)}
  .rtable{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px;text-align:left}
  .rtable th{text-align:left;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
  .rtable td{padding:8px 6px;border-bottom:1px solid #ffffff0d;vertical-align:top}
  .rtable td.ok{color:var(--ok)}.rtable td.bad{color:var(--bad)}
  .spinner{width:48px;height:48px;border:4px solid #ffffff1c;border-top-color:var(--red);border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  #end .box,#mp .box{animation:rise .6s var(--ease) both}
  #loading .center{animation:viewIn .6s var(--ease) both;color:var(--muted)}

  @media(max-width:860px){
    .cards{grid-template-columns:1fr;gap:12px}.mcard{min-height:clamp(100px,18vh,170px)}.mcard .ic{font-size:64px}.mcard b{font-size:22px}
    .lgrid{grid-template-columns:1fr}
    .logo{font-size:32px}
    .screen{padding:12px}
    .logo{font-size:28px}
    .thumb{width:48px;height:66px}
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body class="dark">

<!-- MENU -->
<section id="menu" class="screen active" data-theme="dark">
  <div class="topbar">
    <div class="logo">Anime Duel</div>
    <div class="who">
      <input id="nick" maxlength="14" placeholder="Your nickname">
      <select id="soloRounds" title="Rounds for solo play">
        <option value="5">5 rounds</option><option value="10" selected>10 rounds</option><option value="15">15 rounds</option><option value="20">20 rounds</option>
      </select>
    </div>
  </div>
  <div class="cards">
    <button class="mcard c1" id="cPlay"><div class="ic">🎴</div><b>Play</b><span>Play a random game</span></button>
    <button class="mcard c2" id="cMulti"><div class="ic">⚔️</div><b>Multiplayer</b><span>Play against a friend</span></button>
    <button class="mcard c3" id="cDaily"><div class="ic">📅</div><b>Daily</b><span>Play the daily challenge</span></button>
  </div>
</section>

<!-- MULTIPLAYER ENTRY -->
<section id="mp" class="screen" data-theme="dark">
  <div class="topbar"><div class="logo">Anime Duel</div></div>
  <div class="center box stack">
    <h2>Multiplayer</h2>
    <input id="nick2" class="field" maxlength="14" placeholder="Your nickname">
    <button class="rbtn" id="btnHost">Create a room</button>
    <div class="divider">— or join a friend —</div>
    <div class="row">
      <input id="joinCode" class="field" maxlength="5" placeholder="ROOM CODE" style="text-transform:uppercase;letter-spacing:4px;text-align:center;flex:2">
      <button class="rbtn" id="btnJoin" style="flex:1">Join</button>
    </div>
    <div id="joinMsg" class="divider"></div>
    <button class="obtn" id="btnMpBack">Back</button>
  </div>
</section>

<!-- LOBBY -->
<section id="lobby" class="screen" data-theme="dark">
  <div class="topbar"><div class="logo">Anime Duel</div></div>
  <div class="lgrid">
    <div class="box">
      <div style="text-align:center;color:#888;font-size:13px">ROOM CODE</div>
      <div class="code" id="roomCode">-----</div>
      <div style="text-align:center"><button class="obtn" id="btnCopy" style="color:var(--red)">Copy invite link</button></div>
      <h3 style="margin:18px 0 4px">Players</h3>
      <div class="player"><i></i><span id="pMe"></span></div>
      <div class="player wait" id="pOppBox"><i></i><span id="pOpp"></span></div>
      <div id="hostOnly" style="margin-top:12px">
        <label style="font-size:13px;color:#777">Rounds</label>
        <select id="lobbyRounds" class="field" style="margin-bottom:10px">
          <option value="5">5</option><option value="10" selected>10</option><option value="15">15</option><option value="20">20</option>
        </select>
        <button class="rbtn" id="btnStart" style="width:100%" disabled>Start match</button>
      </div>
      <p id="lobbyHint" style="color:#888;font-size:13px;text-align:center"></p>
      <div id="lobbyResults" hidden style="margin-top:12px;border-top:2px solid #eee;padding-top:12px"></div>
      <div style="text-align:center;margin-top:10px"><button class="link" id="btnLeave">Leave room</button></div>
    </div>
    <div class="box">
      <h3 style="margin:0 0 10px">💬 Lobby chat</h3>
      <div class="chatlog" id="chatlog"></div>
      <div class="row">
        <input id="chatIn" class="field" maxlength="200" placeholder="Say something…" autocomplete="off" style="flex:4">
        <button class="rbtn" id="btnChat" style="flex:1">Send</button>
      </div>
    </div>
  </div>
</section>

<!-- LOADING -->
<section id="loading" class="screen" data-theme="dark">
  <div class="topbar"><div class="logo">Anime Duel</div></div>
  <div class="center"><div class="spinner"></div><div id="loadMsg">Finding characters…</div></div>
</section>

<!-- GAME -->
<section id="game" class="screen" data-theme="dark">
  <div class="topbar"><div class="logo">Anime Duel</div></div>
  <div class="g-main">
    <div class="stage" id="stage">
      <div class="thumbs" id="thumbs"></div>
      <div class="frame"><img id="pic" alt="Which anime is this character from?" referrerpolicy="no-referrer"></div>
    </div>
    <aside class="side">
      <div class="banner">
        <div><span>Round</span><b id="rnd">1/5</b></div>
        <div><span>Score</span><b id="sc">0</b><small id="oppSc"></small></div>
      </div>
      <div class="panel">
        <div id="guessView">
          <div class="phead"><span>Which anime is this from?</span><span id="timeTxt">30</span></div>
          <div class="tbar"><i id="tfill"></i></div>
          <div class="pbody">
            <div class="combo">
              <input id="answer" class="field" placeholder="Type or pick the anime title…" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="80">
              <button type="button" class="chev" id="chev" tabindex="-1" aria-label="Show list">▾</button>
            </div>
            <div id="capNote"></div>
            <button class="gbtn" id="btnSubmit">Submit answer</button>
            <div style="text-align:center"><button class="link" id="btnPass">I don't know</button></div>
          </div>
        </div>
        <div id="revealView" hidden>
          <div class="phead"><span>Round result</span><span id="rvRound"></span></div>
          <div class="pbody">
            <div id="revealBody"></div>
            <div id="nextInfo"></div>
            <button class="gbtn" id="btnNext" hidden>Next ▶</button>
          </div>
        </div>
      </div>
    </aside>
  </div>
</section>

<!-- END (solo / daily) -->
<section id="end" class="screen" data-theme="dark">
  <div class="topbar"><div class="logo">Anime Duel</div></div>
  <div class="center box">
    <div id="endResults"></div>
    <p id="endNote" style="color:#888;font-size:13px"></p>
    <div class="row" style="margin-top:12px">
      <button class="rbtn" id="btnAgain">Play again</button>
      <button class="obtn" id="btnEndMenu" style="color:var(--ink)">Menu</button>
    </div>
  </div>
</section>

/* ===== Answer matching ===== */
function norm(s){return String(s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/&/g,' and ').replace(/['’`]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}
const STOP=new Set(['a','an','the','of','in','to','with','and','is','are','as','at','on','for','my','me','it','from','by','be','was','there','no','ni','wa','wo','ga','de','na','o','x']);
function toks(n){const all=n.split(' ').filter(Boolean);const t=all.filter(w=>!STOP.has(w)&&(w.length>1||/\d/.test(w)));return t.length?t:all;}
function lev(a,b){
  if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){const cur=[i];for(let j=1;j<=b.length;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));}prev=cur;}
  return prev[b.length];
}
function tokEq(a,b){
  if(a===b)return true;
  const m=Math.min(a.length,b.length);
  if(m>=5&&lev(a,b)<=1)return true;
  if(m>=4&&a[0]===b[0]&&lev(a,b)<=1)return true;
  if(m>=8&&lev(a,b)<=2)return true;
  if(a.length>=4&&b.length>a.length&&b.startsWith(a))return true;
  return false;
}
function judge(guess,names){
  const g=norm(guess);if(!g)return false;
  const gc=g.replace(/ /g,'');const gt=toks(g);
  for(const name of names){
    const n=norm(name);if(!n)continue;
    const nc=n.replace(/ /g,'');
    if(gc===nc)return true;
    if(gc.length>=4&&nc.length>=4&&1-lev(gc,nc)/Math.max(gc.length,nc.length)>=0.84)return true;
    if(nc.length>=6&&gc.includes(nc))return true;
    const nt=toks(n);
    const hit=gt.filter(t=>nt.some(x=>tokEq(t,x))).length;
    const rec=nt.filter(x=>gt.some(t=>tokEq(t,x))).length;
    if(gt.length>=2&&hit===gt.length&&rec/nt.length>=0.6)return true;
    if(gt.length===1&&gt[0].length>=5&&nt.length>=2&&nt.length<=4){
      const longest=[...nt].sort((p,q)=>q.length-p.length)[0];
      if(tokEq(gt[0],longest))return true;
    }
  }
  return false;
}
function titleMatches(q,t){
  const nq=norm(q),nt=norm(t);if(!nq||!nt)return false;
  if(nq.replace(/ /g,'')===nt.replace(/ /g,''))return true;
  const qt=toks(nq),tt=toks(nt);
  return qt.length>0&&qt.every(x=>tt.some(y=>tokEq(x,y)));
}
/*LOGIC_END*/

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}
function shuffled(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function titlesOf(a){
  const s=new Set();
  [a.title,a.title_english,...(a.title_synonyms||[]),...((a.titles||[]).map(x=>x.title))].forEach(t=>{if(t&&/[a-z]/i.test(t))s.add(t);});
  return [...s].slice(0,14);
}
async function getJSON(url){
  for(let i=0;i<4;i++){
    try{
      const r=await fetch(url);
      if(r.status===429){await sleep(1300);continue;}
      if(!r.ok)throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(e){if(i===3)throw e;await sleep(800);}
  }
  throw new Error('rate limited');
}
let lastErr='';
/* Source 1: AniList (one request per anime, fast and reliable) */
async function fromAniList(q){
  const query='query($s:String){Page(perPage:6){media(search:$s,type:ANIME,sort:SEARCH_MATCH){title{romaji english} synonyms isAdult characters(sort:FAVOURITES_DESC,perPage:6){nodes{image{large}}}}}}';
  for(let i=0;i<3;i++){
    const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query,variables:{s:q}})});
    if(r.status===429){await sleep(2500);continue;}
    if(!r.ok)throw new Error('AniList HTTP '+r.status);
    const j=await r.json();
    const list=(j.data&&j.data.Page&&j.data.Page.media)||[];
    const ts=m=>[m.title&&m.title.romaji,m.title&&m.title.english,...(m.synonyms||[])].filter(t=>t&&/[a-z]/i.test(t));
    const hit=list.find(m=>!m.isAdult&&ts(m).some(t=>titleMatches(q,t)));
    if(!hit)return null;
    const imgs=((hit.characters&&hit.characters.nodes)||[]).map(n=>n.image&&n.image.large).filter(u=>u&&!u.includes('default')).slice(0,5);
    if(!imgs.length)return null;
    return{imgs,titles:ts(hit).slice(0,14)};
  }
  throw new Error('AniList rate limited');
}
/* Source 2: Jikan / MyAnimeList (backup) */
async function fromJikan(q){
  const j=await getJSON('https://api.jikan.moe/v4/anime?limit=8&q='+encodeURIComponent(q));
  await sleep(380);
  const hit=(j.data||[]).find(a=>titlesOf(a).some(t=>titleMatches(q,t)));
  if(!hit)return null;
  const c=await getJSON('https://api.jikan.moe/v4/anime/'+hit.mal_id+'/characters');
  await sleep(380);
  const url=x=>(x.character&&x.character.images&&((x.character.images.webp&&x.character.images.webp.image_url)||(x.character.images.jpg&&x.character.images.jpg.image_url)))||'';
  const chars=(c.data||[]).filter(x=>{const u=url(x);return u&&!u.includes('questionmark');})
    .sort((a,b)=>(b.favorites||0)-(a.favorites||0)).slice(0,5);
  return chars.length?{imgs:chars.map(url),titles:titlesOf(hit)}:null;
}
const SOURCES=[['AniList',fromAniList],['Jikan',fromJikan]];
const srcFails={AniList:0,Jikan:0};
function findMine(title){
  const nt=norm(title);
  for(const k in MY_IMAGES){
    if(norm(k)!==nt)continue;
    const v=MY_IMAGES[k],arr=(Array.isArray(v)?v:[v]).filter(u=>typeof u==='string'&&u.trim());
    if(arr.length)return arr;
  }
  return null;
}
Object.keys(MY_IMAGES).forEach(k=>{if(!ANIME.some(a=>norm(a[0])===norm(k)))console.warn('[MY_IMAGES] "'+k+'" does not match any title in the ANIME list — check the spelling.');});
async function lookup(entry){
  const key=entry[0];
  const mine=findMine(key);
  if(mine)return{imgs:mine,titles:[],own:true};
  if(cache[key])return cache[key];
  let tried=0,threw=0;
  for(const q of entry[1].split('||')){
    for(const [name,fn] of SOURCES){
      if(srcFails[name]>=3&&SOURCES.some(([n])=>n!==name&&srcFails[n]<3))continue;
      tried++;
      try{
        const info=await fn(q);srcFails[name]=0;
        await sleep(350);
        if(info){cache[key]=info;saveCache();return info;}
      }catch(e){srcFails[name]++;threw++;lastErr=name+': '+((e&&e.message)||e);}
    }
  }
  if(tried>0&&threw===tried)throw new Error(lastErr);
  return null;
}
const failedTitles=new Set();
function startBuilding(n,rnd){
  const my=++buildToken;
  rounds=[];buildDone=false;buildErr=false;
  const order=shuffled(ANIME,rnd);
  (async()=>{
    let k=0,fails=0;
    while(rounds.length<n&&k<order.length&&my===buildToken){
      const e=order[k++];
      if(failedTitles.has(e[0]))continue;
      let info=null;
      try{info=await lookup(e);fails=0;}
      catch(err){fails++;if(fails>=3){buildErr=true;break;}continue;}
      if(my!==buildToken)return;
      if(!info){failedTitles.add(e[0]);continue;}
      const imgs=info.own?shuffled(info.imgs,rnd):shuffled(info.imgs,rnd).slice(0,2); // your own images: show ALL of them
      const names=[e[0],...e[2],...e[1].split('||'),...info.titles];
      rounds.push({imgs,display:e[0],names});
    }
    if(my===buildToken)buildDone=true;
  })();
}
async function waitRound(i){
  for(;;){
    if(rounds[i])return rounds[i];
    if(buildDone)return null;
    await sleep(150);
  }
}

const send=m=>{try{if(conn&&conn.open)conn.send(m);}catch(e){}};
function makeCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:5},()=>a[Math.floor(Math.random()*a.length)]).join('');}
function wireConn(c){
  conn=c;

function onConnClose(){

    conn=null;oppHere=false;

function onMsg(m){
  switch(m.t){
    case 'hello':
      names.opp=String(m.name||'Friend').slice(0,14);oppHere=true;
      addChat('',mode==='host'?names.opp+' joined the room!':'Connected to '+names.opp+"'s room.",'sys');
      updateLobby();break;
    case 'chat':addChat(names.opp,String(m.text||'').slice(0,200));break;
    case 'loading':if(mode==='guest'){show('loading');$('loadMsg').textContent='The host is picking characters…';}break;
    case 'round':
      if(mode!=='guest')return;
      if(m.i===0){scores={me:0,opp:0};history=[];}
      matchActive=true;cur=m.i;total=m.total;beginRound(m.imgs);break;
    case 'cap':
      if(mode==='guest'&&!submitted&&m.i===cur)capTimer();break;
    case 'ans':
      if(mode!=='host'||m.i!==cur||oppAns)return;
      oppAns={text:String(m.text||'').slice(0,80),ms:Math.max(0,Math.min(ROUND_MS,+m.ms||ROUND_MS))};
      if(!submitted)capTimer();
      tryResolve();break;
    case 'result':if(mode==='guest')showResult({display:m.display,me:m.me,opp:m.opp,scores:m.scores});break;
    case 'end':if(mode==='guest'){scores=m.scores;history=m.hist||[];matchActive=false;clearTimers();finish();}break;
  }
}

/* ===== match flow ===== */
function begin(kind){
  clearTimers();
  scores={me:0,opp:0};history=[];cur=-1;matchActive=true;matchToken++;
  let n,rnd=Math.random;
  if(kind==='daily'){n=5;rnd=mulberry32(hashStr('animeduel-'+today()));}
  else if(kind==='solo')n=+$('soloRounds').value;
  else n=+$('lobbyRounds').value;
  total=n;
  startBuilding(n,rnd);
  show('loading');$('loadMsg').textContent='Finding characters…';
  if(kind==='mp')send({t:'loading'});
  nextRound();
}
async function nextRound(){
  clearTimeout(nextTimer);clearInterval(cdTimer);
  const my=matchToken;
  cur++;
  if(cur>=total)return endGame();
  const r=await waitRound(cur);
  if(my!==matchToken)return;
  if(!r){
    if(!rounds.length){
      alert(buildErr?'Could not load characters from the anime databases.\n\nDetails: '+lastErr+'\n\nCheck your internet connection, try another network or turn off ad-blockers, then try again.':'No rounds could be loaded. Please try again.');
      matchActive=false;
      return isMP()?(show('lobby'),updateLobby()):toMenu();
    }
    total=rounds.length;return endGame();
  }
  if(mode==='host')send({t:'round',i:cur,total,imgs:r.imgs});
  beginRound(r.imgs);
  if(mode==='host'){
    clearTimeout(fallbackTimer);
    fallbackTimer=setTimeout(()=>{if(!oppAns)oppAns={text:'',ms:ROUND_MS};tryResolve();},ROUND_MS+CAP_MS+4000);
  }
}

  const text=$('answer').value.trim().slice(0,80);
  const ms=Math.min(ROUND_MS,performance.now()-startAt);
  $('answer').disabled=true;$('btnSubmit').disabled=true;$('btnPass').disabled=true;
  if(isMP())$('capNote').textContent='Answer locked in — waiting for '+names.opp+'…';
  if(mode==='guest'){send({t:'ans',i:cur,text,ms});return;}
  myAns={text,ms};
  if(mode==='host'&&!oppAns)send({t:'cap',i:cur});
  tryResolve();
}
function tryResolve(){
  if(resolved||mode==='guest'||!myAns)return;
  if(isMP()&&!oppAns)return;
  resolved=true;clearTimeout(fallbackTimer);
  const r=rounds[cur];
  const j=a=>{
    const ok=!!(a&&a.text&&judge(a.text,r.names));
    const pts=ok?POINTS_FIRST:0;
    return{text:a?a.text:'',ok,pts};
  };
  const me=j(myAns),opp=isMP()?j(oppAns):null;
  if(opp&&me.ok&&opp.ok){ // both right: the faster one gets 5, the slower one 3
    if(myAns.ms<oppAns.ms)opp.pts=POINTS_LAST;
    else if(oppAns.ms<myAns.ms)me.pts=POINTS_LAST;
  }
  const ns={me:scores.me+me.pts,opp:scores.opp+(opp?opp.pts:0)};
  if(mode==='host')send({t:'result',display:r.display,me:opp,opp:me,scores:{me:ns.opp,opp:ns.me}});
  showResult({display:r.display,me,opp,scores:ns});
  nextTimer=setTimeout(nextRound,REVEAL_MS);
}
function showResult(res){
  clearInterval(tick);clearInterval(cdTimer);revTimers.forEach(clearTimeout);revTimers=[];
  submitted=true;
  history.push({display:res.display,me:res.me,opp:res.opp});
  const finalScores=res.scores;
  $('guessView').hidden=true;$('revealView').hidden=false;
  $('rvRound').textContent=(cur+1)+'/'+total;
  const box=$('revealBody');box.innerHTML='';
  const rows=[[names.me,res.me]];if(res.opp)rows.push([names.opp,res.opp]);
  const items=rows.map(([nm,a])=>{
    const row=el('div','rrow');
    const verd=el('div','rverd','…');
    row.append(el('div','rname',nm),el('div','rsaid',a.text||'— no answer —'),verd);
    box.append(row);return{row,a,verd};
  });
  const abox=el('div','abox');const atitle=el('div','atitle','???');
  abox.append(el('small','','The anime was'),atitle);box.append(abox);
  $('btnNext').hidden=true;
  const last=cur+1>=total;
  const t0=performance.now();
  const upd=()=>{const s=Math.max(0,Math.ceil((REVEAL_MS-(performance.now()-t0))/1000));$('nextInfo').textContent=(last?'Final results in ':'Next round in ')+s+'s';};
  upd();cdTimer=setInterval(upd,250);
  revTimers.push(setTimeout(()=>{
    items.forEach(({row,a,verd})=>{row.classList.add(a.ok?'ok':'bad');verd.textContent=a.ok?'✓ +'+a.pts:'✗';});
    atitle.textContent=res.display;abox.classList.add('show');
    scores=finalScores;
    $('sc').textContent=scores.me;$('sc').classList.remove('bump');void $('sc').offsetWidth;$('sc').classList.add('bump');
    $('oppSc').textContent=isMP()?names.opp+': '+scores.opp:'';
    if(!isMP()){$('btnNext').hidden=false;$('btnNext').textContent=last?'See results ▶':'Next ▶';}
  },isMP()?2200:1300));
}
function endGame(){
  clearTimers();matchActive=false;
  if(mode==='host')send({t:'end',scores:{me:scores.opp,opp:scores.me},hist:history.map(h=>({display:h.display,me:h.opp,opp:h.me}))});
  finish();
}
function finish(replay){
  if(isMP()){renderResults($('lobbyResults'));$('lobbyResults').hidden=false;updateLobby();show('lobby');}
  else{
    renderResults($('endResults'));
    $('btnAgain').hidden=(mode==='daily');
    $('endNote').textContent=mode==='daily'?(replay?"You already played today's challenge. Come back tomorrow!":'Come back tomorrow for a new daily challenge!'):'';
    if(mode==='daily'&&!replay){try{localStorage.setItem('ad-daily-'+today(),JSON.stringify({score:scores.me,history}));}catch(e){}}
    show('end');
  }
}
function renderResults(box){
  box.innerHTML='';
  const head=el('div','rhead');
  if(isMP()){
    head.append(el('div','rbig',scores.me>scores.opp?'🏆 You win!':scores.me<scores.opp?'😢 '+names.opp+' wins':"🤝 It's a draw!"),
      el('div','rsub',names.me+' '+scores.me+'  —  '+scores.opp+' '+names.opp));
  }else head.append(el('div','rbig','Final score'),el('div','rsub',scores.me+' points'));
  box.append(head);
  const t=el('table','rtable');const hr=el('tr');
  ['Anime',isMP()?names.me:'Your answer',isMP()?names.opp:'Points'].forEach(x=>hr.append(el('th','',x)));t.append(hr);
  history.forEach(h=>{
    const tr=el('tr');tr.append(el('td','',h.display));
    const cell=a=>el('td',a.ok?'ok':'bad',(a.ok?'✓ ':'✗ ')+(a.text||'—')+(a.ok?' (+'+a.pts+')':''));
    if(isMP()&&h.opp){tr.append(cell(h.me),cell(h.opp));}
    else tr.append(el('td','',h.me.text||'—'),el('td',h.me.ok?'ok':'bad',h.me.ok?'+'+h.me.pts:'0'));
    t.append(tr);
  });
  box.append(t);
}

/* ===== lobby UI ===== */
function updateLobby(){
  $('roomCode').textContent=roomCode||'-----';
  $('pMe').textContent=names.me+(mode==='host'?' (host)':'');
  $('pOpp').textContent=oppHere?names.opp+(mode==='guest'?' (host)':''):'Waiting for a friend…';
  $('pOppBox').classList.toggle('wait',!oppHere);
  $('hostOnly').hidden=mode!=='host';
  $('btnStart').disabled=!(mode==='host'&&oppHere&&!matchActive);
  $('lobbyHint').textContent=mode==='host'?(oppHere?'Everyone is here — press Start!':'Share the code or the invite link.'):'Waiting for the host to start the match…';
}
function addChat(who,text,cls){
  const m=el('div','msg '+(cls||''));
  if(who)m.append(el('b','',who+': '));
  m.append(document.createTextNode(text));
  $('chatlog').append(m);$('chatlog').scrollTop=1e9;
}
function sendChat(){
  const t=$('chatIn').value.trim().slice(0,200);if(!t)return;
  if(!oppHere)addChat('','Nobody else is in the room yet.','sys');
  else{send({t:'chat',text:t});addChat(names.me,t,'me');}
  $('chatIn').value='';
}
function toMenu(){
  matchToken++;buildToken++;clearTimers();matchActive=false;
  const p=peer,c=conn;mode=null;peer=null;conn=null;oppHere=false;
  try{c&&c.close();}catch(e){}try{p&&p.destroy();}catch(e){}
  $('btnJoin').disabled=false;$('joinMsg').textContent='';
  history.length=0;
  show('menu');
}

/* ===== wiring ===== */
try{const n=localStorage.getItem('ad-nick')||'';$('nick').value=n;$('nick2').value=n;}catch(e){}
$('cPlay').onclick=()=>{names.me=getNick();mode='solo';begin('solo');};
$('cMulti').onclick=()=>show('mp');
$('cDaily').onclick=()=>{
  names.me=getNick();mode='daily';
  const saved=safeParse(localStorage.getItem('ad-daily-'+today()));
  if(saved){scores={me:saved.score,opp:0};history=saved.history||[];finish(true);}
  else begin('daily');
};
$('btnHost').onclick=hostRoom;
$('btnJoin').onclick=joinRoom;
$('joinCode').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom();});
$('btnMpBack').onclick=()=>show('menu');
$('btnStart').onclick=()=>begin('mp');
$('btnLeave').onclick=toMenu;
$('btnAgain').onclick=()=>{names.me=getNick();mode='solo';begin('solo');};
$('btnEndMenu').onclick=toMenu;
$('btnSubmit').onclick=submit;
$('btnPass').onclick=()=>{$('answer').value='';submit();};
$('answer').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();if(!ddOpen)openDD();moveDD(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();if(!ddOpen)openDD();moveDD(-1);}
  else if(e.key==='Escape'){closeDD();}
  else if(e.key==='Enter'){
    e.preventDefault();
    if(ddOpen&&ddHi>=0&&ddItems[ddHi])chooseDD(ddItems[ddHi].textContent);
    else{closeDD();submit();}
  }
});
$('answer').addEventListener('input',()=>{openDD();});
$('answer').addEventListener('focus',()=>{if(ddSuppress){ddSuppress=false;return;}openDD();});
$('answer').addEventListener('click',()=>{if(!ddOpen)openDD();});
$('answer').addEventListener('blur',()=>{setTimeout(closeDD,150);});
$('chev').onmousedown=e=>e.preventDefault();
$('chev').onclick=()=>{if(ddOpen)closeDD();else{$('answer').focus();openDD();}};
window.addEventListener('resize',()=>{if(ddOpen)placeDD();});
$('btnNext').onclick=()=>{clearTimeout(nextTimer);clearInterval(cdTimer);nextRound();};
$('btnChat').onclick=sendChat;
$('chatIn').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat();});
$('btnCopy').onclick=()=>{
  const link=location.href.split('#')[0]+'#'+roomCode;
  const done=()=>{$('btnCopy').textContent='Copied!';setTimeout(()=>$('btnCopy').textContent='Copy invite link',1500);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(link).then(done,()=>prompt('Copy this link:',link));
  else prompt('Copy this link:',link);
};
if(location.hash.length>1){$('joinCode').value=location.hash.slice(1,6).toUpperCase();show('mp');}
